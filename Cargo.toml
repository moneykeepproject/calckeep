[package]
name = "calckeep"
version = "0.1.0"
edition = "2021"
description = "CalcKeep - financial calculators (Rust + Slint) for desktop, web (WASM) and mobile"
authors = ["MoneyKeep Project contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/moneykeepproject/calckeep"

[lib]
# rlib for the desktop binary, cdylib for WASM and Android
crate-type = ["rlib", "cdylib"]

[workspace]
# xtask: developer tasks (cargo xtask release / installer), as in MoneyKeep
members = ["xtask"]

[[bin]]
name = "calckeep"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.107", features = ["Window", "Storage"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.android]
package = "com.calckeep.app"
apk_name = "calckeep"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
